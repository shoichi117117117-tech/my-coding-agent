[project]
name = "my-coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shoichi Hatano", email = "shoichi117117117@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "litellm>=1.101.0",
    "google-genai>=2.23.0",
    "rich>=15.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "aiohttp>=3.14.3",
    "huggingface-hub>=1.31.0",
    "boto3>=1.43.94",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]

[project.scripts]
my-coding-agent = "my_coding_agent:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests calling live external LLM APIs",
]